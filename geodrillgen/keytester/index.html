<!DOCTYPE html>
<html>
  <head>
    <script>      
      function displayKeycode(keyCode) {
        const elem = document.getElementById("display");
        elem.innerHTML.textContent = keyCode;
        
        const code = "alert('lulz');";
        elem.innterHTML.textContent = code;
      }

      function modifyText(newText) {
        const t2 = document.getElementById("display");
        t2.firstChild.nodeValue = newText;
      }
      
      // thank you mdn
      document.addEventListener("keydown", e => {
        modifyText(e.keyCode);
      });
    </script>
  </head>
  <body>
    <p id="display">lol something changed 1</p>

  </body>
</html>
