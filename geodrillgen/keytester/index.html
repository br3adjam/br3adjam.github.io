<!DOCTYPE html>
<html>
  <head>
    <script>      
      function displayKeycode(keyCode) {
        const elem = document.getElementById("display");
        elem.innerHTML.textContent = keyCode;
        
        const code = "alert('lulz');";
        elem.innterHTML.textContent = code;
      }

      document.addEventListener('keydown', e => {
        displayKeycode(e.code);
      });
    </script>
  </head>
  <body>
    <p id="display">keydown for dkeycode</p>

  </body>
</html>
